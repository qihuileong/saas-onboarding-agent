                  value:
                    collection:
                      - type: calendly
                        start_time: '2020-01-02T20:00:00.000000Z'
                        end_time: '2020-01-02T20:30:00.000000Z'
                        buffered_start_time: '2020-01-02T19:30:00.000000Z'
                        buffered_end_time: '2020-01-02T21:00:00.000000Z'
